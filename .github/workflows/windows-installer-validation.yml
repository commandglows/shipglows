name: ShipGlows repository gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_failure:
        description: Prove required-gate failure propagation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shipglows-required-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: ShipGlows required gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact tested revision
        # actions/checkout v7.0.1, pinned to its verified commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify revision and classify changed paths
        id: impact
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPARE_MODE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HEAD_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid head SHA: $env:HEAD_SHA"
          }
          $actualHead = (git rev-parse HEAD).Trim()
          if ($actualHead -cne $env:HEAD_SHA) {
            throw "Checked-out SHA mismatch: expected $env:HEAD_SHA, got $actualHead"
          }

          $pathsFile = Join-Path $env:RUNNER_TEMP 'shipglows-changed-paths.txt'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            Set-Content -LiteralPath $pathsFile -Encoding UTF8 -Value 'tests/windows/devserver-contract.sh'
          } elseif ($env:BASE_SHA -match '^0{40}$') {
            git ls-tree -r --name-only $env:HEAD_SHA | Set-Content -LiteralPath $pathsFile -Encoding UTF8
          } else {
            if ($env:BASE_SHA -notmatch '^[0-9a-f]{40}$') {
              throw "Invalid base SHA: $env:BASE_SHA"
            }
            git cat-file -e "$env:BASE_SHA^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Base SHA is unavailable: $env:BASE_SHA" }
            $range = if ($env:COMPARE_MODE -eq 'merge-base') {
              "$env:BASE_SHA...$env:HEAD_SHA"
            } else {
              "$env:BASE_SHA..$env:HEAD_SHA"
            }
            git -c core.quotepath=false diff --name-only --diff-filter=ACDMRTUXB $range |
              Set-Content -LiteralPath $pathsFile -Encoding UTF8
            if ($LASTEXITCODE -ne 0) { throw "Changed-path comparison failed: $range" }
          }

          $result = & .\.github\scripts\Resolve-WindowsValidationImpact.ps1 `
            -PathsFile $pathsFile `
            -GitHubOutput $env:GITHUB_OUTPUT
          $result | Format-List

      - name: Report no Windows impact
        if: steps.impact.outputs.windows_changed == 'false'
        shell: pwsh
        run: Write-Host 'No Windows-owned path changed; the stable repository gate remains successful.'

      - name: Install pinned ripgrep for the Windows contract
        if: steps.impact.outputs.windows_changed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '15.2.0'
          $expectedSha256 = '71B2FEF860ABE467217A538FF31DE02F5258807C0129F771846F87BD029AAFC5'
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-$version.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'shipglows-ripgrep'
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip"

          & curl.exe --fail --location --silent --show-error --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "ripgrep download failed with exit $LASTEXITCODE" }
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualSha256 -cne $expectedSha256) {
            throw "ripgrep SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination "ripgrep-$version-x86_64-pc-windows-msvc"
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'rg.exe') -PathType Leaf)) {
            throw 'Verified ripgrep archive did not contain rg.exe at the expected path.'
          }
          $bin | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'rg.exe') --version

      - name: Run complete Windows contract
        if: steps.impact.outputs.windows_changed == 'true'
        shell: bash
        run: bash tests/windows/devserver-contract.sh

      - name: Exercise selective archive extraction
        if: steps.impact.outputs.windows_changed == 'true'
        shell: powershell
        env:
          SHIPGLOWS_TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP ("shipglows-bootstrap-test-" + [guid]::NewGuid().ToString('N'))
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install-shipglows.ps1 -Branch $env:SHIPGLOWS_TEST_REF -ShipglowsDir $target -DownloadOnly
            if ($LASTEXITCODE -ne 0) {
              throw "Windows bootstrap exited with code $LASTEXITCODE"
            }
            $installed = Join-Path $target 'local\install_local.ps1'
            if (Test-Path -LiteralPath $installed) {
              throw "Download-only validation unexpectedly installed: $installed"
            }
          } finally {
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Force -Recurse -ErrorAction SilentlyContinue
            }
          }

      - name: Prove failure propagation when requested
        if: github.event_name == 'workflow_dispatch' && inputs.force_failure
        shell: pwsh
        run: throw 'Intentional required-gate failure propagation proof.'
