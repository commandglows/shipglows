name: Validate dev runtime adaptation

on:
  # CI manuelle (evite les couts) : Actions > Run workflow, ou `gh workflow run <fichier>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-runtime-adaptation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test host observation and context contracts
        run: python -m unittest tools.test_agent_runtime_envelope tools.test_context_quality_contract tools.test_project_delivery_policy_reader tools.test_project_git_policy tools.test_metier_first_public_skills_contract tools.test_skill_activation_budget tools.test_high_traffic_activation_profiles tools.test_103_sg_verify_compaction_contract

      - name: Validate adapted reference metadata
        run: python tools/shipglows_metadata_lint.py skills/references/browser-extension-lab.md skills/references/obsidian-plugin-workflow.md skills/references/project-delivery-policy.md skills/305-sg-init/references/bootstrap-entrypoint-and-dev-mode.md skills/references/preferred-stacks.md skills/103-sg-verify/references/verification-security-ui-runtime.md

      - name: Validate skill activation budgets and code index
        run: |
          python tools/skill_activation_budget.py --scenarios
          python tools/skill_code_index_lint.py

      - name: Observe the hosted runner without probing tools
        run: python tools/agent_runtime_envelope.py --format json

      - name: Test Windows instruction projection in temporary files
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows/agent-instructions.ps1
