name: Validate dev runtime adaptation

on:
  push:
    branches: [codex/adapt-dev-runtime-contracts]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dev-runtime-adaptation.yml
      - tools/agent_runtime_envelope.py
      - tools/test_agent_runtime_envelope.py
      - tools/test_context_quality_contract.py
      - cli/windows/ShipGlows.AgentInstructions.psm1
      - tests/windows/agent-instructions.ps1
      - skills/**
      - shipglows_data/technical/extension-lifecycle-lab.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-runtime-adaptation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test host observation and context contracts
        run: python -m unittest tools.test_agent_runtime_envelope tools.test_context_quality_contract

      - name: Observe the hosted runner without probing tools
        run: python tools/agent_runtime_envelope.py --format json

      - name: Test Windows instruction projection in temporary files
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows/agent-instructions.ps1
